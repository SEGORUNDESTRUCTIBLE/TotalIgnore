name: Publish macOS bundle

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Existing version tag to build and attach to a draft release
                required: true
                type: string

permissions:
    contents: write

jobs:
    Publish:
        if: github.repository == 'SEGORUNDESTRUCTIBLE/TotalIgnore'
        runs-on: macos-14

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.tag }}

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Vencord
              env:
                  RELEASE_TAG: ${{ inputs.tag }}
              run: |
                  version="$(node -p "require('./package.json').version")"
                  if [[ "$RELEASE_TAG" != "v$version" ]]; then
                      echo "Tag $RELEASE_TAG does not match package.json version v$version" >&2
                      exit 1
                  fi
                  pnpm build --standalone

            - name: Download the macOS Vencord installer
              run: |
                  mkdir -p dist/Installer
                  curl --fail --location --retry 3 \
                      https://github.com/Vencord/Installer/releases/latest/download/VencordInstallerCli-darwin \
                      --output dist/Installer/VencordInstallerCli-darwin
                  chmod +x dist/Installer/VencordInstallerCli-darwin

            - name: Package macOS bundle
              run: bash distribution/installer/Build-MacBundle.sh

            - name: Upload bundle to this release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ inputs.tag }}
              run: |
                  archive=(dist/BLOCK++-Vencord-*.zip)
                  if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/is-draft"; then
                      if [[ "$(cat "$RUNNER_TEMP/is-draft")" != "true" ]]; then
                          echo "Release $RELEASE_TAG is already published; create the macOS asset before publishing." >&2
                          exit 1
                      fi
                      gh release upload "$RELEASE_TAG" "${archive[0]}" --clobber
                  else
                      gh release create "$RELEASE_TAG" "${archive[0]}" \
                          --draft \
                          --verify-tag \
                          --title "$RELEASE_TAG" \
                          --notes "BLOCK++ community build. See the repository README for installation instructions."
                  fi
